<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300..800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:transparent;font-family:"Open Sans",Arial,sans-serif}
/* wordmark only (the magnifying-glass mark was dropped 2026-10-08 per the client) */
.logo{display:inline-flex;align-items:center;padding:12px 16px;direction:rtl}
.logo .t{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.logo b{font-weight:800;font-stretch:75%;font-size:46px;color:#437D98;letter-spacing:-.01em}
.logo small{font-weight:600;font-size:13.5px;letter-spacing:.22em;color:#197EB4;margin-top:7px}
.white b{color:#fff}.white small{color:#97C8DD}
.dark{background:#437D98}
</style>
</head>
<body>
<div class="logo" id="color">
  <span class="t"><b>נטע שגיא</b><small>חקירות · מודיעין · פוליגרף</small></span>
</div>
<br>
<div class="logo white dark" id="white">
  <span class="t"><b>נטע שגיא</b><small>חקירות · מודיעין · פוליגרף</small></span>
</div>
</body>
</html>
